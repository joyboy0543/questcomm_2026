<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QCPD Photo Booth — The Sapphire Heist</title>
    <style>
        :root {
            --edge: #243546;
            --bg: #0b1218;
            --panel: #0d1a24;
            --ink: #cfe6f7;
            --ok: #29d49a;
            --accent: #2ea8ff;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, Segoe UI, Roboto, Arial
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center
        }

        h2 {
            margin: 8px 0 4px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center
        }

        input,
        button {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--edge);
            background: #102536;
            color: #fff;
            cursor: pointer;
        }

        video,
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 660px;
            max-height: 70vh;
            object-fit: contain;
            border: 1px solid var(--edge);
            border-radius: 16px;
            background: var(--panel);
            transform-origin: center center;
        }

        .hint {
            opacity: .9;
            font-size: .95rem
        }

        .notice {
            width: 100%;
            max-width: 760px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #8a4;
            background: #0d1a24;
            color: #cfe6f7;
        }

        .warn {
            border-color: #a44;
            background: #2a1111;
            color: #ffdede;
        }

        .notice small {
            opacity: 0.95;
        }

        /* Simple modal for help */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal {
            background: #0d1a24;
            border: 1px solid var(--edge);
            color: var(--ink);
            border-radius: 12px;
            max-width: 760px;
            width: calc(100% - 24px);
            padding: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .modal h3 {
            margin-top: 0;
        }

        .modal .close {
            float: right;
            background: #173247;
            border: 1px solid #27475f;
        }

        .modal ol {
            padding-left: 20px;
        }

        .modal a {
            color: #8bd1ff;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h2>QCPD Photo Booth — The Sapphire Heist</h2>

        <div id="env-notice"></div>

        <div class="row">
            <input id="agent" placeholder="Detective name (caption)">
            <button id="open">Open Camera</button>
            <button id="capture" disabled>Capture</button>
            <button id="retake" disabled>Retake</button>
            <button id="flip" disabled>Flip to Front</button>
            <button id="hats" disabled>Hats: 0</button>
            <button id="help">How to enable camera</button>
        </div>

        <video id="vid" playsinline></video>
        <canvas id="can" style="display:none"></canvas>

        <div class="row">
            <!-- Upload removed per request -->
            <button id="download" disabled>Download Photo</button>
        </div>

        <p id="msg" class="hint">Yay! Congratulations Detective, one more case solved! It is now time to celebrate.</p>
        <p id="msg2" class="hint">Downloading the photo will be private to your device.</p>
    </div>

    <!-- Help modal -->
    <div id="help-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal">
            <button class="close" id="help-close">Close</button>
            <h3>Enable camera permission</h3>
            <div id="help-body">
                <!-- Filled dynamically based on platform -->
            </div>
        </div>
    </div>

    <script>
        /* =======================
         * 1) Configure your Web App URL
         * ======================= */
        // Uses the web app link you provided earlier. Replace if you redeploy.
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1KMpPnw75NgX4fch9gI66LgKwqHOMEf1K5VmRtFsbZ3HbaVFpFxwfjZlxE56Tws82YA/exec';

        /* =======================
         * 2) Helpers: QR params, thumbnail, central log
         * ======================= */
        function getParams() {
            const p = new URLSearchParams(location.search);
            return {
                name: (p.get('name') || '').trim(),
                team: (p.get('team') || '').trim(),
                event: (p.get('event') || '').trim(),
                auto: p.get('auto') === '1'
            };
        }
        const qp = getParams();

        // Build a small JPEG thumbnail (base64, no prefix), ~220 px wide
        function dataURLToThumbBase64(dataURL, targetW = 220, quality = 0.7) {
            return new Promise((resolve) => {
                if (!dataURL) return resolve(null);
                const img = new Image();
                img.onload = () => {
                    const scale = targetW / img.width;
                    const w = targetW;
                    const h = Math.max(1, Math.round(img.height * scale));
                    const off = document.createElement('canvas');
                    off.width = w; off.height = h;
                    const x = off.getContext('2d');
                    x.drawImage(img, 0, 0, w, h);
                    const out = off.toDataURL('image/jpeg', quality); // "data:image/jpeg;base64,..."
                    resolve(out.split(',')[1] || null); // return base64 only
                };
                img.onerror = () => resolve(null);
                img.src = dataURL;
            });
        }

        // Send to Apps Script (no OAuth prompts for users)
        async function sendCentralLog(payload) {
            if (!SCRIPT_URL) return;
            try {
                const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                if (navigator.sendBeacon && navigator.sendBeacon(SCRIPT_URL, blob)) return;
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    keepalive: true
                });
            } catch (e) {
                console.debug('Central log failed (non-fatal):', e);
            }
        }

        //         const img = new Image();
        //         img.onload = () => {

        //     const payload = {
        //         type: 'capture',
        //         name: ((agent.value || localStorage.getItem('qcpd.name') || 'Detective').trim() || 'Detective'),
        //         team: ((new URLSearchParams(location.search).get('team') || 'Team Detective').trim() || 'Team Detective'),

        // }

        /* =======================
         * 3) DOM refs & page wiring
         * ======================= */
        const vid = document.getElementById('vid');
        const can = document.getElementById('can');
        const ctx = can.getContext('2d');
        const openBtn = document.getElementById('open');
        const capBtn = document.getElementById('capture');
        const retakeBtn = document.getElementById('retake');
        const flipBtn = document.getElementById('flip');
        const hatsBtn = document.getElementById('hats');
        const downloadBtn = document.getElementById('download');
        const helpBtn = document.getElementById('help');
        const msg = document.getElementById('msg');
        const agent = document.getElementById('agent');
        const envNotice = document.getElementById('env-notice');

        // Prefill name from QR param (and remember on this device)
        if (qp.name) {
            agent.value = qp.name;
            try { localStorage.setItem('qcpd.name', qp.name); } catch { }
        } else {
            // if no ?name, prefill from prior visit for convenience
            try {
                const stored = localStorage.getItem('qcpd.name');
                if (stored) agent.value = stored;
            } catch { }
        }
        agent.addEventListener('change', () => {
            const v = (agent.value || '').trim();
            if (v) try { localStorage.setItem('qcpd.name', v); } catch { }
        });

        // Try to auto-open camera if ?auto=1
        window.addEventListener('DOMContentLoaded', () => {
            if (qp.auto) setTimeout(() => openBtn.click(), 350);
        });

        /* =======================
         * 4) Help modal
         * ======================= */
        const helpBackdrop = document.getElementById('help-backdrop');
        const helpClose = document.getElementById('help-close');
        const helpBody = document.getElementById('help-body');

        function addNotice(html, warn = false) {
            const div = document.createElement('div');
            div.className = 'notice' + (warn ? ' warn' : '');
            div.innerHTML = html;
            envNotice.appendChild(div);
        }
        function isInAppBrowser() {
            const ua = navigator.userAgent || '';
            const isInstagram = ua.includes('Instagram');
            const isFB = ua.includes('FBAN') || ua.includes('FBAV');
            const isLine = ua.includes(' Line/');
            const isWeChat = ua.includes('MicroMessenger');
            const isGmail = ua.includes('Gmail');
            const isDrive = ua.includes('Drive');
            return isInstagram || isFB || isLine || isWeChat || isGmail || isDrive;
        }
        (function startupChecks() {
            if (!window.isSecureContext) {
                addNotice(`<b>Camera requires HTTPS.</b><br/>Open this page over <code>https://</code>.`, true);
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                addNotice(`<b>Camera API unavailable in this browser.</b><br/>Open in Safari/Chrome or try updating your browser.`, true);
            }
            if (isInAppBrowser()) {
                addNotice(`<b>Camera may be blocked by this in‑app browser.</b><br/>Use the ••• or share menu to <b>Open in Safari/Chrome</b>.`);
            }
            addNotice(`<b>Note:</b> If you previously blocked camera, you must enable it in your browser settings for this site.`);
        })();

        function platformHelpHtml() {
            const ua = navigator.userAgent || '';
            const isIOS = /iPhone|iPad|iPod/i.test(ua);
            const isAndroid = /Android/i.test(ua);
            const common = `
        <p><small>Why this happens: If a site’s camera permission is set to <i>Not allowed</i>, the browser won’t ask again until you change it in settings.</small></p>
      `;
            if (isIOS) {
                return `
          ${common}
          <h4>iPhone / iPad (Safari)</h4>
          <ol>
            <li>Open the page in <b>Safari</b> (not inside another app’s browser).</li>
            <li>In Safari, tap the <b>aA</b> icon in the address bar → <b>Website Settings</b> → <b>Camera</b> → set to <b>Allow</b>.</li>
            <li>Or go to <b>Settings</b> → <b>Safari</b> → <b>Camera</b> → choose <b>Allow</b>.</li>
            <li>Reload this page and tap <b>Open Camera</b> again.</li>
          </ol>
          <h4>iPhone / iPad (Chrome)</h4>
          <ol>
            <li>Open in the <b>Chrome</b> app directly.</li>
            <li>Chrome menu (⋮) → <b>Settings</b> → <b>Site Settings</b> → <b>Camera</b> → Allow.</li>
            <li>Reload this page and tap <b>Open Camera</b>.</li>
          </ol>
        `;
            } else if (isAndroid) {
                return `
          ${common}
          <h4>Android (Chrome)</h4>
          <ol>
            <li>Open in the <b>Chrome</b> app directly.</li>
            <li>Tap the <b>lock</b> icon in the address bar → <b>Permissions</b> → <b>Camera</b> → <b>Allow</b>.</li>
            <li>Or Chrome <b>⋮</b> → <b>Settings</b> → <b>Site settings</b> → <b>Camera</b> → <b>Allowed</b> and allow this site.</li>
            <li>Reload this page and tap <b>Open Camera</b>.</li>
          </ol>
        `;
            } else {
                return `
          ${common}
          <h4>Desktop (Chrome/Edge)</h4>
          <ol>
            <li>Click the <b>camera</b> or <b>lock</b> icon in the address bar.</li>
            <li>Set <b>Camera</b> permission to <b>Allow</b> for this site.</li>
            <li>Reload the page and click <b>Open Camera</b>.</li>
          </ol>
          <h4>Desktop (Safari)</h4>
          <ol>
            <li>Safari → <b>Settings for This Website…</b> → <b>Camera</b> → <b>Allow</b>.</li>
            <li>Reload and click <b>Open Camera</b>.</li>
          </ol>
        `;
            }
        }
        function openHelp() {
            helpBody.innerHTML = platformHelpHtml();
            helpBackdrop.style.display = 'flex';
            helpBackdrop.setAttribute('aria-hidden', 'false');
        }
        function closeHelp() {
            helpBackdrop.style.display = 'none';
            helpBackdrop.setAttribute('aria-hidden', 'true');
        }
        helpBtn.onclick = openHelp;
        helpClose.onclick = closeHelp;
        helpBackdrop.addEventListener('click', (e) => { if (e.target === helpBackdrop) closeHelp(); });

        /* =======================
         * 5) Camera logic
         * ======================= */
        let stream, imageDataURL;
        let facing = 'environment'; // or 'user'
        let mirror = false;
        let hatCount = 0;

        function applyPreviewTransforms() {
            const mirrorScale = mirror ? -1 : 1;
            vid.style.transform = `scaleX(${mirrorScale})`;  // Only mirror the live preview
            can.style.transform = 'none';                    // NEVER mirror canvas (keep text normal)
            flipBtn.textContent = facing === 'environment' ? 'Flip to Front' : 'Flip to Back';
            hatsBtn.textContent = `Hats: ${hatCount}`;
        }

        async function stopStream() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
        }

        async function getBestStream(desiredFacing) {
            try {
                return await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: desiredFacing, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
            } catch (e) { /* fallback next */ }

            const devices = await navigator.mediaDevices.enumerateDevices();
            const videos = devices.filter(d => d.kind === 'videoinput');
            if (!videos.length) throw new Error('No camera device found');
            const norm = s => (s || '').toLowerCase();
            let pick;
            if (desiredFacing === 'environment') {
                pick = videos.find(d => norm(d.label).includes('back')) || videos.slice(-1)[0];
            } else {
                pick = videos.find(d => norm(d.label).includes('front')) || videos[0];
            }
            return await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: pick.deviceId } }, audio: false });
        }

        async function checkCameraPermissionState() {
            if (!navigator.permissions || !navigator.permissions.query) return null;
            try {
                const status = await navigator.permissions.query({ name: 'camera' });
                return status.state; // 'granted' | 'denied' | 'prompt'
            } catch {
                return null;
            }
        }

        function addNotice(html, warn = false) {
            const div = document.createElement('div');
            div.className = 'notice' + (warn ? ' warn' : '');
            div.innerHTML = html;
            envNotice.appendChild(div);
        }

        function showDeniedNoticeInline() {
            addNotice(
                `<b>Camera permission is blocked for this site.</b><br/>
         You must allow it in your <b>browser settings</b>, then reload and tap <b>Open Camera</b>.`,
                true
            );
        }

        async function openCamera() {
            try {
                const state = await checkCameraPermissionState();
                if (state === 'denied') {
                    showDeniedNoticeInline();
                }

                await stopStream();
                stream = await getBestStream(facing);
                vid.srcObject = stream;

                await vid.play();
                capBtn.disabled = true;
                flipBtn.disabled = false;
                hatsBtn.disabled = false;

                await new Promise(res => {
                    if (vid.readyState >= 2) return res();
                    vid.onloadedmetadata = () => res();
                    setTimeout(res, 800);
                });

                capBtn.disabled = false;
                mirror = (facing === 'user');
                applyPreviewTransforms();
                msg.textContent = 'Camera ready — align and Capture.';
            } catch (e) {
                console.error('openCamera failed:', e);
                if (!window.isSecureContext) {
                    msg.textContent = 'Camera requires HTTPS. Open this page over https://';
                    return;
                }
                if (e.name === 'NotAllowedError' || e.name === 'SecurityError') {
                    showDeniedNoticeInline();
                    msg.innerHTML = 'Camera permission denied. Open <b>How to enable camera</b> for steps.';
                    return;
                }
                if (e.name === 'NotFoundError' || /No camera device/.test(e.message || '')) {
                    msg.textContent = 'No camera device found.';
                    return;
                }
                msg.textContent = 'Camera unavailable here. Try opening in Safari/Chrome.';
            }
        }

        openBtn.onclick = openCamera;

        flipBtn.onclick = async () => {
            facing = (facing === 'environment') ? 'user' : 'environment';
            await openCamera();
        };

        hatsBtn.onclick = () => {
            hatCount = (hatCount + 1) % 5;
            hatsBtn.textContent = `Hats: ${hatCount}`;
        };

        /* =======================
         * 6) Overlays and capture
         * ======================= */
        function fitFontSize(text, basePx, maxWidth, fontStack) {
            let size = Math.max(10, basePx);
            ctx.font = `${size}px ${fontStack}`;
            while (ctx.measureText(text).width > maxWidth && size > 10) {
                size -= 1;
                ctx.font = `${size}px ${fontStack}`;
            }
            return size;
        }
        function wrapTwoLines(text, maxWidth) {
            const words = text.split(/\s+/);
            let line1 = '';
            let i = 0;
            for (; i < words.length; i++) {
                const test = line1 ? (line1 + ' ' + words[i]) : words[i];
                if (ctx.measureText(test).width <= maxWidth) line1 = test;
                else break;
            }
            const line2 = words.slice(i).join(' ');
            return [line1, line2];
        }

        function drawRoundedRectPath(ctx, x, y, w, h, r) {
            const rr = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + rr, y);
            ctx.arcTo(x + w, y, x + w, y + h, rr);
            ctx.arcTo(x + w, y + h, x, y + h, rr);
            ctx.arcTo(x, y + h, x, y, rr);
            ctx.arcTo(x, y, x + w, y, rr);
            ctx.closePath();
        }
        function drawHat(ctx, cx, cy, size, rotRad = 0) {
            const brimW = size * 1.1, brimH = size * 0.22, crownW = size * 0.62, crownH = size * 0.38, bandH = crownH * 0.22;
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(rotRad);
            ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.ellipse(0, brimH * 0.55, brimW * 0.55, brimH * 0.35, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            ctx.fillStyle = '#2b2b2f'; ctx.strokeStyle = '#1e1e22'; ctx.lineWidth = Math.max(2, size * 0.02);
            ctx.beginPath(); ctx.ellipse(0, 0, brimW / 2, brimH / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            const cx0 = -crownW / 2, cy0 = -brimH * 0.75 - crownH * 0.5;
            drawRoundedRectPath(ctx, cx0, cy0, crownW, crownH, size * 0.06); ctx.fillStyle = '#35353b'; ctx.fill(); ctx.strokeStyle = '#222228'; ctx.stroke();
            ctx.fillStyle = '#c9853a'; ctx.fillRect(cx0, cy0 + crownH * 0.45, crownW, bandH);
            ctx.globalAlpha = 0.12; ctx.fillStyle = '#fff'; drawRoundedRectPath(ctx, cx0 + 3, cy0 + 3, crownW - 6, bandH * 0.6, size * 0.03); ctx.fill();
            ctx.restore();
        }
        function computeHatPlacements(w, h, count) {
            const s = Math.min(w, h) * 0.22, yTop = h * 0.22, arr = [];
            if (count <= 0) return arr;
            if (count === 1) arr.push({ x: w * 0.50, y: yTop, s, r: 0 });
            else if (count === 2) { arr.push({ x: w * 0.28, y: yTop, s, r: -0.14 }); arr.push({ x: w * 0.72, y: yTop, s, r: 0.14 }); }
            else if (count === 3) {
                arr.push({ x: w * 0.22, y: yTop * 1.04, s: s * 0.95, r: -0.16 });
                arr.push({ x: w * 0.50, y: yTop * 0.95, s, r: 0 });
                arr.push({ x: w * 0.78, y: yTop * 1.04, s: s * 0.95, r: 0.16 });
            } else {
                arr.push({ x: w * 0.20, y: yTop * 1.08, s: s * 0.92, r: -0.18 });
                arr.push({ x: w * 0.42, y: yTop * 0.98, s: s * 0.95, r: -0.06 });
                arr.push({ x: w * 0.64, y: yTop * 1.00, s: s * 0.95, r: 0.06 });
                arr.push({ x: w * 0.82, y: yTop * 1.10, s: s * 0.90, r: 0.18 });
            }
            return arr;
        }
        function drawHatsOverlay(w, h, count) {
            if (!count) return;
            for (const p of computeHatPlacements(w, h, count)) drawHat(ctx, p.x, p.y, p.s, p.r);
        }

        function drawFrame(w, h, name) {
            const isPortrait = (w / h) < 0.9;

            if (!isPortrait) {
                // LANDSCAPE
                const grad = ctx.createLinearGradient(0, 0, w, 0);
                grad.addColorStop(0, '#0e2130'); grad.addColorStop(1, '#10324a');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, w, Math.floor(h * 0.13));
                ctx.fillStyle = '#cfe6f7';
                ctx.font = `${Math.floor(h * 0.055)}px "Segoe UI", system-ui, Arial`;
                ctx.fillText('👑 QCPD — The Sapphire Heist', Math.floor(w * 0.035), Math.floor(h * 0.085));
                ctx.fillStyle = 'rgba(16,37,54,0.92)';
                ctx.fillRect(0, Math.floor(h * 0.80), w, Math.floor(h * 0.20));
                ctx.fillStyle = '#29d49a';
                ctx.font = `${Math.floor(h * 0.05)}px "Segoe UI", system-ui, Arial`;
                ctx.fillText(`Detective ${name} • Case Solved! The Evidence will be sent to Archives`, Math.floor(w * 0.035), Math.floor(h * 0.92));
                ctx.font = `${Math.floor(h * 0.06)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
                ctx.fillText('🔷', Math.floor(w * 0.70), Math.floor(h * 0.10));
                ctx.fillText('💍', Math.floor(w * 0.75), Math.floor(h * 0.10));
                ctx.fillText('📿', Math.floor(w * 0.80), Math.floor(h * 0.10));
                ctx.fillText('♦️', Math.floor(w * 0.85), Math.floor(h * 0.10));
                ctx.fillText('✨', Math.floor(w * 0.02), Math.floor(h * 0.87));
                ctx.fillText('🚔', Math.floor(w * 0.06), Math.floor(h * 0.87));
                ctx.fillText('✨', Math.floor(w * 0.10), Math.floor(h * 0.87));
                return;
            }

            // PORTRAIT
            const sideM = Math.floor(w * 0.04);
            const innerW = w - sideM * 2;

            const topH = Math.floor(h * 0.10);
            const grad = ctx.createLinearGradient(0, 0, w, 0);
            grad.addColorStop(0, '#0e2130'); grad.addColorStop(1, '#10324a');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, w, topH);

            const title = '👑 QCPD — The Sapphire Heist';
            const titleFontStack = `"Segoe UI", system-ui, Arial`;
            const titleBase = Math.floor(h * 0.045);
            const titleSize = fitFontSize(title, titleBase, innerW, titleFontStack);
            ctx.font = `${titleSize}px ${titleFontStack}`;
            ctx.fillStyle = '#cfe6f7';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'left';
            ctx.fillText(title, sideM, Math.floor(topH * 0.58));

            const botH = Math.floor(h * 0.16);
            const botY = h - botH;
            ctx.fillStyle = 'rgba(16,37,54,0.92)';
            ctx.fillRect(0, botY, w, botH);

            const baseCaption = `Detective ${name} • Case Solved!`;
            const extra = `The Evidence will be sent to Archives`;
            const capFontStack = `"Segoe UI", system-ui, Arial`;
            let capSize = fitFontSize(baseCaption, Math.floor(h * 0.045), innerW, capFontStack);
            ctx.font = `${capSize}px ${capFontStack}`;
            let line1 = baseCaption, line2 = extra;

            if (ctx.measureText(baseCaption).width > innerW) {
                const [l1, l2first] = wrapTwoLines(baseCaption, innerW);
                line1 = l1;
                if (l2first) {
                    const join = l2first + ' — ' + extra;
                    if (ctx.measureText(join).width <= innerW) {
                        line2 = join;
                    } else if (ctx.measureText(l2first).width <= innerW) {
                        line2 = l2first;
                    } else {
                        line2 = '';
                    }
                } else {
                    if (ctx.measureText(extra).width > innerW) {
                        capSize = fitFontSize(extra, capSize, innerW, capFontStack);
                        ctx.font = `${capSize}px ${capFontStack}`;
                    }
                    line2 = extra;
                }
            } else {
                if (ctx.measureText(extra).width > innerW) {
                    const newSize = fitFontSize(extra, capSize, innerW, capFontStack);
                    if (newSize < capSize) {
                        capSize = newSize;
                        ctx.font = `${capSize}px ${capFontStack}`;
                    }
                }
            }

            ctx.fillStyle = '#29d49a';
            ctx.textBaseline = 'alphabetic';
            ctx.textAlign = 'left';
            const lineGap = Math.max(4, Math.floor(capSize * 0.28));
            const firstY = Math.floor(botY + botH * 0.45);
            ctx.fillText(line1, sideM, firstY);
            if (line2) ctx.fillText(line2, sideM, firstY + capSize + lineGap);

            ctx.font = `${Math.floor(h * 0.055)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
            ctx.fillText('✨🔷💍🔷✨', Math.floor(sideM), Math.floor(botY - h * 0.02));
        }

        function drawVideoToCanvas() {
            const vw = vid.videoWidth, vh = vid.videoHeight;
            if (!vw || !vh) return false;
            can.width = vw; can.height = vh;

            // Draw mirrored live video when front camera is used
            ctx.save();
            if (mirror) { ctx.translate(vw, 0); ctx.scale(-1, 1); }
            ctx.drawImage(vid, 0, 0, vw, vh);
            ctx.restore();

            // Draw overlays and text normally (never mirrored)
            const name = (agent.value || '').trim() || localStorage.getItem('qcpd.name') || 'Detective';
            drawFrame(vw, vh, name);
            drawHatsOverlay(vw, vh, hatCount);
            return true;
        }

        /* =======================
         * 7) Capture, log, download
         * ======================= */
        capBtn.onclick = async () => {
            const ok = drawVideoToCanvas();
            if (!ok) { msg.textContent = 'Video not ready.'; return; }
            await stopStream();
            vid.style.display = 'none'; can.style.display = 'block';
            downloadBtn.disabled = false; retakeBtn.disabled = false;
            capBtn.disabled = true; flipBtn.disabled = true; hatsBtn.disabled = true;

            const imageDataURL = can.toDataURL('image/jpeg', 0.92);
            msg.textContent = 'Review the shot. You can retake or download.';

            // Build the central log payload (with thumbnail) and send once
            const thumbB64 = await dataURLToThumbBase64(imageDataURL, 220, 0.7);
            const payload = {
                type: 'capture',
                name: ((agent.value || localStorage.getItem('qcpd.name') || 'Detective').trim() || 'Detective'),
                team: ((qp.team || 'Team Detective').trim() || 'Team Detective'),
                event: (qp.event || '').trim(),
                ts: Date.now(),
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
                ua: navigator.userAgent || '',
                facing,
                hats: hatCount || 0,
                thumbB64: thumbB64 || null,
                thumbType: thumbB64 ? 'image/jpeg' : null
            };
            sendCentralLog(payload);
        };

        retakeBtn.onclick = async () => {
            can.style.display = 'none'; vid.style.display = 'block';
            downloadBtn.disabled = true; retakeBtn.disabled = true;
            capBtn.disabled = false; flipBtn.disabled = false; hatsBtn.disabled = false;
            await openCamera();
        };

        downloadBtn.onclick = () => {
            const dataUrl = can.toDataURL('image/jpeg', 0.92);
            if (!dataUrl) { msg.textContent = 'No image to download yet.'; return; }
            const a = document.createElement('a'); a.href = dataUrl; a.download = `qcpd_${Date.now()}.jpg`; a.click();
        };
    </script>
</body>
