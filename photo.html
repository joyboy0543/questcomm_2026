<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QCPD Photo Booth — The Sapphire Heist</title>
    <style>
        :root {
            --edge: #243546;
            --bg: #0b1218;
            --panel: #0d1a24;
            --ink: #cfe6f7;
            --ok: #29d49a;
            --accent: #2ea8ff;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, Segoe UI, Roboto, Arial
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center
        }

        h2 {
            margin: 8px 0 4px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center
        }

        input,
        button {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--edge);
            background: #102536;
            color: #fff
        }

        button {
            cursor: pointer
        }

        /* Mobile-friendly preview: no cropping, letterboxed if needed */
        video,
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 660px;
            max-height: 70vh;
            object-fit: contain;
            border: 1px solid var(--edge);
            border-radius: 16px;
            background: var(--panel);
            transform-origin: center center;
        }

        .hint {
            opacity: .9;
            font-size: .95rem
        }

        .notice {
            max-width: 760px;
            margin: 12px auto;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #8a4;
            background: #0d1a24;
            color: #cfe6f7;
        }

        .warn {
            border-color: #a44;
            background: #2a1111;
            color: #ffdede;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h2>QCPD Photo Booth — The Sapphire Heist</h2>

        <div id="env-notice" style="width:100%"></div>

        <div class="row">
            <input id="agent" placeholder="Detective name (caption)">
            <button id="open">Open Camera</button>
            <button id="capture" disabled>Capture</button>
            <button id="retake" disabled>Retake</button>
            <button id="flip" disabled>Flip to Front</button>
        </div>

        <video id="vid" playsinline></video>
        <canvas id="can" style="display:none"></canvas>

        <div class="row">
            <button id="upload" disabled>Upload to database</button>
            <button id="download" disabled>Download Photo</button>
        </div>

        <p id="msg" class="hint">Yay! Congratulations Detective, one more case solved! It is now time to celebrate.</p>
        <p id="msg2" class="hint">Uploading the photo gives consent to share this image for event purposes.
            Downloading the photo will be private to your device.</p>
    </div>

    <script>
        // Your latest Web App (must end with /exec) — kept for future use
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyi1b9kKnbDFRd4jP_n05Brj6RrDoWWisZsHAAOOC7BMa9psy8iQPevc9Uk7XJwCZZBdQ/exec';

        const vid = document.getElementById('vid');
        const can = document.getElementById('can');
        const ctx = can.getContext('2d');
        const openBtn = document.getElementById('open');
        const capBtn = document.getElementById('capture');
        const retakeBtn = document.getElementById('retake');
        const flipBtn = document.getElementById('flip');
        const uploadBtn = document.getElementById('upload');
        const downloadBtn = document.getElementById('download');
        const msg = document.getElementById('msg');
        const agent = document.getElementById('agent');
        const envNotice = document.getElementById('env-notice');

        // Prefill agent from localStorage
        (() => {
            const stored = localStorage.getItem('qcpd.name');
            if (stored) agent.value = stored;
        })();

        // ---- Environment checks (HTTPS, in-app browsers) ----
        function isSecureContextOk() {
            return (window.isSecureContext === true);
        }
        function isInAppBrowser() {
            const ua = navigator.userAgent || '';
            const isInstagram = ua.includes('Instagram');
            const isFB = ua.includes('FBAN') || ua.includes('FBAV');
            const isLine = ua.includes(' Line/');
            const isWeChat = ua.includes('MicroMessenger');
            const isGmail = ua.includes('Gmail');
            const isDrive = ua.includes('Drive');
            return isInstagram || isFB || isLine || isWeChat || isGmail || isDrive;
        }
        function addNotice(html, warn = false) {
            const div = document.createElement('div');
            div.className = 'notice' + (warn ? ' warn' : '');
            div.innerHTML = html;
            envNotice.appendChild(div);
        }
        (function startupChecks() {
            if (!isSecureContextOk()) {
                addNotice(
                    `<b>Camera requires HTTPS.</b><br/>
           Open this page over <code>https://</code> (e.g., GitHub Pages / Netlify).`,
                    true
                );
            }
            if (isInAppBrowser()) {
                addNotice(
                    `<b>Camera may be blocked by this in‑app browser.</b><br/>
           Tap the ••• or share icon, then <b>Open in Safari/Chrome</b> for camera access.`
                );
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                addNotice(
                    `<b>Camera API unavailable in this browser.</b><br/>
           Try updating your browser or opening in Safari/Chrome on this device.`,
                    true
                );
            }
        })();

        // ---- Camera state ----
        let stream, imageDataURL;
        let facing = 'environment'; // or 'user'
        let mirror = false;         // true for front camera (selfie)

        function applyPreviewTransforms() {
            const mirrorScale = mirror ? -1 : 1;
            const t = `scaleX(${mirrorScale})`;
            vid.style.transform = t;
            can.style.transform = t;
            flipBtn.textContent = facing === 'environment' ? 'Flip to Front' : 'Flip to Back';
        }

        async function stopStream() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
        }

        async function getBestStream(desiredFacing /* 'environment' | 'user' */) {
            // 1) Try by facingMode
            try {
                return await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: desiredFacing,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
            } catch (e) {
                // continue to fallback
            }

            // 2) Fallback: enumerate devices and pick by label or position
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videos = devices.filter(d => d.kind === 'videoinput');

            if (!videos.length) {
                throw new Error('No camera device found');
            }

            const norm = s => (s || '').toLowerCase();
            let pick;
            if (desiredFacing === 'environment') {
                pick = videos.find(d => norm(d.label).includes('back')) || videos.slice(-1)[0];
            } else {
                pick = videos.find(d => norm(d.label).includes('front')) || videos[0];
            }

            return await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: pick.deviceId } },
                audio: false
            });
        }

        async function openCamera() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    msg.textContent = 'Camera API unavailable in this browser.';
                    return;
                }

                await stopStream();
                stream = await getBestStream(facing);
                vid.srcObject = stream;

                // Wait metadata so videoWidth/Height are known
                await vid.play();
                capBtn.disabled = true; // enable after metadata
                flipBtn.disabled = false;

                await new Promise(res => {
                    if (vid.readyState >= 2) return res();
                    vid.onloadedmetadata = () => res();
                    setTimeout(res, 800); // safety
                });

                capBtn.disabled = false;
                mirror = (facing === 'user');
                applyPreviewTransforms();
                msg.textContent = 'Camera ready — align and Capture.';
            } catch (e) {
                console.error('openCamera failed:', e);
                if (!window.isSecureContext) {
                    msg.textContent = 'Camera requires HTTPS. Open this page over https://';
                    return;
                }
                if (e.name === 'NotAllowedError' || e.name === 'SecurityError') {
                    msg.innerHTML = 'Camera permission denied.<br/>On iPhone: Settings → Safari/Chrome → Camera → Allow.';
                } else if (e.name === 'NotFoundError' || /No camera device/.test(e.message || '')) {
                    msg.textContent = 'No camera device found.';
                } else {
                    msg.textContent = 'Camera unavailable here. Try opening in Safari/Chrome.';
                }
            }
        }

        openBtn.onclick = openCamera;

        flipBtn.onclick = async () => {
            facing = (facing === 'environment') ? 'user' : 'environment';
            await openCamera();
        };

        // ---- Frame overlay ----
        function drawFrame(w, h, name) {
            // Top banner
            const grad = ctx.createLinearGradient(0, 0, w, 0);
            grad.addColorStop(0, '#0e2130'); grad.addColorStop(1, '#10324a');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, w, Math.floor(h * 0.13));
            ctx.fillStyle = '#cfe6f7';
            ctx.font = `${Math.floor(h * 0.055)}px "Segoe UI", system-ui, Arial`;
            ctx.fillText('👑 QCPD — The Sapphire Heist', Math.floor(w * 0.035), Math.floor(h * 0.085));
            // Bottom ribbon
            ctx.fillStyle = 'rgba(16,37,54,0.92)';
            ctx.fillRect(0, Math.floor(h * 0.80), w, Math.floor(h * 0.20));
            // Caption
            ctx.fillStyle = '#29d49a';
            ctx.font = `${Math.floor(h * 0.05)}px "Segoe UI", system-ui, Arial`;
            ctx.fillText(`Detective ${name} • Case Solved! The Evidence will be sent to Archives`, Math.floor(w * 0.035), Math.floor(h * 0.92));
            // Fun accents
            ctx.font = `${Math.floor(h * 0.06)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
            ctx.fillText('🔷', Math.floor(w * 0.70), Math.floor(h * 0.10));
            ctx.fillText('💍', Math.floor(w * 0.75), Math.floor(h * 0.10));
            ctx.fillText('📿', Math.floor(w * 0.80), Math.floor(h * 0.10));
            ctx.fillText('♦️', Math.floor(w * 0.85), Math.floor(h * 0.10));
            ctx.fillText('✨', Math.floor(w * 0.02), Math.floor(h * 0.87));
            ctx.fillText('🚔', Math.floor(w * 0.06), Math.floor(h * 0.87));
            ctx.fillText('✨', Math.floor(w * 0.10), Math.floor(h * 0.87));
        }

        function drawVideoToCanvas() {
            const vw = vid.videoWidth, vh = vid.videoHeight;
            if (!vw || !vh) return false;

            can.width = vw;
            can.height = vh;

            ctx.save();
            // Mirror horizontally if front camera
            if (mirror) {
                ctx.translate(vw, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(vid, 0, 0, vw, vh);
            ctx.restore();

            const name = (agent.value || '').trim() || localStorage.getItem('qcpd.name') || 'Detective';
            drawFrame(vw, vh, name);
            return true;
        }

        capBtn.onclick = () => {
            const vw = vid.videoWidth, vh = vid.videoHeight;
            if (!vw || !vh) { msg.textContent = 'Video not ready.'; return; }

            const ok = drawVideoToCanvas();
            if (!ok) { msg.textContent = 'Video not ready.'; return; }

            stopStream();
            vid.style.display = 'none';
            can.style.display = 'block';

            // Review state
            uploadBtn.disabled = false;
            downloadBtn.disabled = false;
            retakeBtn.disabled = false;
            capBtn.disabled = true;
            flipBtn.disabled = true;

            imageDataURL = can.toDataURL('image/jpeg', 0.92);
            msg.textContent = 'Review the shot. You can retake or upload / download.';
        };

        retakeBtn.onclick = async () => {
            can.style.display = 'none';
            vid.style.display = 'block';

            uploadBtn.disabled = true;
            downloadBtn.disabled = true;
            retakeBtn.disabled = true;
            capBtn.disabled = false;
            flipBtn.disabled = false;

            await openCamera();
        };

        // ---- Upload flow: open Drive folder + save/share with friendly filename ----
        function dataURLToBlob(dataURL) {
            const [hdr, b64] = dataURL.split(',');
            const mime = (hdr.match(/data:([^;]+);base64/) || [, 'application/octet-stream'])[1];
            const bin = atob(b64);
            const len = bin.length;
            const u8 = new Uint8Array(len);
            for (let i = 0; i < len; i++) u8[i] = bin.charCodeAt(i);
            return new Blob([u8], { type: mime });
        }
        function buildSafeFilename(agentName) {
            const base = (agentName || '').trim() || localStorage.getItem('qcpd.name') || 'detective';
            const safe = base
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9_-]+/gi, '_')
                .replace(/^_+|_+$/g, '')
                .toLowerCase() || 'detective';
            return `detective_${safe}.jpg`;
        }

        // (Kept for future: Apps Script direct upload)
        async function postForm() {
            const fd = new FormData();
            fd.append('op', 'uploadPhoto');
            fd.append('agentName', agent.value.trim());
            fd.append('imageBase64', imageDataURL);
            fd.append('filename', `qcpd_${Date.now()}.jpg`);
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: fd });
            let json = null; try { json = await res.json(); } catch (e) { }
            return { ok: res.ok && json && json.ok, status: res.status, json };
        }

        uploadBtn.onclick = async () => {
            if (!imageDataURL) {
                msg.textContent = 'Capture a photo first, then upload.';
                return;
            }

            // 1) Open your shared Drive folder
            const folderUrl = 'https://drive.google.com/drive/folders/1uSNnX4Mpic3IHEfjuy6QVXdFTm52AIWm?usp=sharing';
            window.open(folderUrl, '_blank', 'noopener');

            // 2) Prompt to save/share with a friendly filename
            const filename = buildSafeFilename(agent.value);

            try {
                const blob = dataURLToBlob(imageDataURL);
                const file = new File([blob], filename, { type: 'image/jpeg' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Detective Photo',
                        text: 'Upload to Drive folder'
                    });
                    msg.textContent = 'Shared successfully. If you opened Drive, you can also upload there.';
                    return;
                }
            } catch (e) {
                console.debug('Share failed or not supported; falling back to download.', e);
            }

            // Fallback: trigger a save dialog
            const a = document.createElement('a');
            a.href = imageDataURL;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();

            msg.textContent = 'Photo saved. Drag & drop into the opened Drive tab to upload.';
        };

        downloadBtn.onclick = () => {
            if (!imageDataURL) { msg.textContent = 'No image to download yet.'; return; }
            const a = document.createElement('a');
            a.href = imageDataURL;
            a.download = `qcpd_${Date.now()}.jpg`;
            a.click();
        };
    </script>
</body>

</html>
