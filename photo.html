<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>QCPD Photo Booth</title>
    <style>
        body {
            margin: 0;
            background: #0b1218;
            color: #cfe6f7;
            font-family: system-ui, Segoe UI, Roboto, Arial
        }

        .wrap {
            max-width: 680px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center
        }

        video,
        canvas {
            width: 100%;
            max-width: 560px;
            border: 1px solid #243546;
            border-radius: 12px;
            background: #0d1a24
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center
        }

        input,
        button {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #243546;
            background: #102536;
            color: #fff
        }

        button {
            cursor: pointer
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h2>QCPD Photo Booth — The Sapphire Heist</h2>
        <div class="row">
            <input id="agent" placeholder="Detective name (for caption)">
            <button id="open">Open Camera</button>
            <button id="capture" disabled>Capture</button>
            <button id="retake" disabled>Retake</button>
        </div>
        <video id="vid" playsinline></video>
        <canvas id="can" style="display:none"></canvas>

        <div class="row">
            <button id="upload" disabled>Upload to database</button>
            <button id="email" disabled>Send via email</button>
        </div>

        <p id="msg"></p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwDra52zJTHmD2Ed0R2ouGebHNy3rqlhnpuKMqBBMIm02OCi4X2KBf1IavHAz-5CUQrMQ/exec';
        const vid = document.getElementById('vid');
        const can = document.getElementById('can');
        const ctx = can.getContext('2d');
        const openBtn = document.getElementById('open');
        const capBtn = document.getElementById('capture');
        const retakeBtn = document.getElementById('retake');
        const uploadBtn = document.getElementById('upload');
        const emailBtn = document.getElementById('email');
        const msg = document.getElementById('msg');
        const agent = document.getElementById('agent');

        let stream;
        let imageDataURL;

        openBtn.onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                vid.srcObject = stream;
                await vid.play();
                capBtn.disabled = false;
                msg.textContent = 'Camera ready.';
            } catch (e) {
                msg.textContent = 'Camera permission denied.';
            }
        };

        capBtn.onclick = () => {
            const w = vid.videoWidth, h = vid.videoHeight;
            if (!w || !h) { msg.textContent = 'Video not ready.'; return; }
            // Set canvas
            can.width = w; can.height = h;
            // Draw video frame
            ctx.drawImage(vid, 0, 0, w, h);

            // Overlay frame (simple themed frame + caption)
            // Top banner
            ctx.fillStyle = 'rgba(16,37,54,0.85)';
            ctx.fillRect(0, 0, w, Math.floor(h * 0.12));
            // Title
            ctx.fillStyle = '#cfe6f7';
            ctx.font = `${Math.floor(h * 0.05)}px sans-serif`;
            ctx.fillText('QCPD — The Sapphire Heist', Math.floor(w * 0.04), Math.floor(h * 0.08));

            // Bottom ribbon
            ctx.fillStyle = 'rgba(16,37,54,0.85)';
            ctx.fillRect(0, Math.floor(h * 0.82), w, Math.floor(h * 0.18));

            // Caption
            const name = agent.value.trim() || 'Detective';
            ctx.fillStyle = '#29d49a';
            ctx.font = `${Math.floor(h * 0.05)}px sans-serif`;
            ctx.fillText(`QCPD Detective ${name} — Case Solved`, Math.floor(w * 0.04), Math.floor(h * 0.92));

            // Stop preview and show canvas
            if (stream) { stream.getTracks().forEach(t => t.stop()); }
            vid.style.display = 'none';
            can.style.display = 'block';
            retakeBtn.disabled = false;
            uploadBtn.disabled = false;
            emailBtn.disabled = false;

            imageDataURL = can.toDataURL('image/jpeg', 0.92);
            msg.textContent = 'Review the shot. You can retake or upload/email.';
        };

        retakeBtn.onclick = async () => {
            can.style.display = 'none';
            vid.style.display = 'block';
            uploadBtn.disabled = true;
            emailBtn.disabled = true;
            retakeBtn.disabled = true;
            capBtn.disabled = false;
            await openBtn.onclick();
        };

        async function postForm(op) {
            const fd = new FormData();
            fd.append('op', op);
            fd.append('agentName', agent.value.trim());
            fd.append('imageBase64', imageDataURL);
            fd.append('filename', `qcpd_${Date.now()}.jpg`);
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: fd });
            return res; // we don’t need to read the body for now
        }

        uploadBtn.onclick = async () => {
            msg.textContent = 'Uploading...';
            await postForm('uploadPhoto');
            msg.textContent = 'Uploaded to database (Drive + photos sheet).';
        };

        emailBtn.onclick = async () => {
            msg.textContent = 'Sending email...';
            await postForm('emailPhoto');
            msg.textContent = 'Sent via email.';
        };
    </script>
</body>

</html>
