
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuestComm 2026 — Briefing</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .landing { max-width: 760px; margin: 6vh auto; background:#141a20; border:1px solid #1f2730; border-radius:12px; padding:20px }
    .landing h1 { margin: 0 0 8px 0; font-size: 1.6rem }
    .landing p { color: var(--muted) }
    form.grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top: 12px }
    .grid label { display:block; font-weight:600; margin-bottom:4px }
    .grid input { width:100%; padding:10px; border-radius:8px; border:1px solid #223041; background:#0d1318; color:var(--text) }
    .actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap }
    .btn { background:#0c1217; color:var(--text); border:1px solid #223041; border-radius:8px; padding:10px 14px; cursor:pointer }
    .note { color:var(--muted); font-size:.9rem; margin-top:10px }
    .chip { display:inline-flex; align-items:center; gap:8px; padding:8px 10px; border-radius:999px; background:#10161c; border:1px solid #1f2730 }
  </style>
</head>
<body>
  <main class="landing">
    <h1>QuestComm 2026 — Team Briefing</h1>
    <p>Enter your details to begin. Your progress will be stored on this device.</p>

    <div id="resumeBox" style="display:none; margin:10px 0 4px">
      <span class="chip">⏱️ Resume available</span>
    </div>

    <form id="briefingForm" class="grid" autocomplete="on">
      <div>
        <label for="team">Team</label>
        <input id="team" name="team" placeholder="e.g., Alpha" required>
      </div>
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" placeholder="Your name" required>
      </div>
      <div style="grid-column:1/-1" class="actions">
        <button class="btn" type="submit">Start Investigation</button>
        <a id="resumeLink" class="btn" href="game.html" style="display:none">Resume</a>
      </div>
    </form>

    <p class="note">Tip: You can also prefill using QR parameters like <code>?team=Alpha&name=Jay</code>.</p>
  </main>
  <script src="js/landing.js"></script>
</body>
</html>
