<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QCPD Photo Booth — The Sapphire Heist</title>
    <style>
        :root {
            --edge: #243546;
            --bg: #0b1218;
            --panel: #0d1a24;
            --ink: #cfe6f7;
            --ok: #29d49a;
            --warn: #ffcc29;
            --accent: #2ea8ff;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, Segoe UI, Roboto, Arial
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center
        }

        h2 {
            margin: 8px 0 4px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center
        }

        input,
        button {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--edge);
            background: #102536;
            color: #fff
        }

        button {
            cursor: pointer
        }

        video,
        canvas {
            width: 100%;
            max-width: 660px;
            border: 1px solid var(--edge);
            border-radius: 16px;
            background: var(--panel)
        }

        .hint {
            opacity: .9;
            font-size: .95rem
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h2>QCPD Photo Booth — The Sapphire Heist</h2>

        <div class="row">
            <input id="agent" placeholder="Detective name (caption)">
            <button id="open">Open Camera</button>
            <button id="capture" disabled>Capture</button>
            <button id="retake" disabled>Retake</button>
        </div>

        <video id="vid" playsinline></video>
        <canvas id="can" style="display:none"></canvas>

        <div class="row">
            <input id="toEmail" type="email" placeholder="Recipient email (for Send via email)">
            <button id="upload" disabled>Upload to database</button>
            <button id="email" disabled>Send via email</button>
        </div>

        <p id="msg" class="hint">By taking a photo you consent to uploading/emailing this image for event purposes.</p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTx-QL4JV3ujreEHhZXQOwzsu2_t1PCKyapKWTo7Qp85pgwOVF6Nio3h-OwBiRCgH5Dg/exec';

        const vid = document.getElementById('vid');
        const can = document.getElementById('can');
        const ctx = can.getContext('2d');
        const openBtn = document.getElementById('open');
        const capBtn = document.getElementById('capture');
        const retakeBtn = document.getElementById('retake');
        const uploadBtn = document.getElementById('upload');
        const emailBtn = document.getElementById('email');
        const msg = document.getElementById('msg');
        const agent = document.getElementById('agent');
        const toEmail = document.getElementById('toEmail');

        // Prefill agent from landing page
        (() => {
            const stored = localStorage.getItem('qcpd.name');
            if (stored) agent.value = stored;
        })();

        let stream, imageDataURL, lastUploadURL = '';

        openBtn.onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                vid.srcObject = stream; await vid.play();
                capBtn.disabled = false; msg.textContent = 'Camera ready — align your shot and press “Capture”.';
            } catch (e) { console.error(e); msg.textContent = 'Camera permission denied.'; }
        };

        function drawFrame(w, h, name) {
            // Background photo already drawn
            // Top banner
            const grad = ctx.createLinearGradient(0, 0, w, 0);
            grad.addColorStop(0, '#0e2130'); grad.addColorStop(1, '#10324a');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, w, Math.floor(h * 0.13));
            // Title
            ctx.fillStyle = '#cfe6f7';
            ctx.font = `${Math.floor(h * 0.055)}px "Segoe UI", system-ui, Arial`;
            ctx.fillText('👑 QCPD — The Sapphire Heist', Math.floor(w * 0.035), Math.floor(h * 0.085));
            // Bottom ribbon
            ctx.fillStyle = 'rgba(16,37,54,0.92)';
            ctx.fillRect(0, Math.floor(h * 0.80), w, Math.floor(h * 0.20));
            // Caption
            ctx.fillStyle = '#29d49a';
            ctx.font = `${Math.floor(h * 0.05)}px "Segoe UI", system-ui, Arial`;
            ctx.fillText(`Detective ${name} • Case Solved`, Math.floor(w * 0.035), Math.floor(h * 0.92));
            // Fun emoji accents
            ctx.font = `${Math.floor(h * 0.06)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
            ctx.fillText('🔷', Math.floor(w * 0.90), Math.floor(h * 0.11));
            ctx.fillText('🚔', Math.floor(w * 0.06), Math.floor(h * 0.87));
            ctx.fillText('✨', Math.floor(w * 0.82), Math.floor(h * 0.16));
        }

        capBtn.onclick = () => {
            const w = vid.videoWidth, h = vid.videoHeight;
            if (!w || !h) { msg.textContent = 'Video not ready.'; return; }
            can.width = w; can.height = h; ctx.drawImage(vid, 0, 0, w, h);
            const name = (agent.value || '').trim() || localStorage.getItem('qcpd.name') || 'Detective';
            drawFrame(w, h, name);
            if (stream) { stream.getTracks().forEach(t => t.stop()); }
            vid.style.display = 'none'; can.style.display = 'block';
            retakeBtn.disabled = false; uploadBtn.disabled = false; emailBtn.disabled = false;
            imageDataURL = can.toDataURL('image/jpeg', 0.92);
            msg.textContent = 'Review the shot. You can retake or upload/email.';
        };

        retakeBtn.onclick = async () => {
            can.style.display = 'none'; vid.style.display = 'block';
            uploadBtn.disabled = true; emailBtn.disabled = true; retakeBtn.disabled = true; capBtn.disabled = false;
            await openBtn.onclick();
        };

        async function postForm(op) {
            const fd = new FormData();
            fd.append('op', op);
            fd.append('agentName', agent.value.trim());
            fd.append('imageBase64', imageDataURL);
            fd.append('filename', `qcpd_${Date.now()}.jpg`);
            if (op === 'emailPhoto') fd.append('toEmail', (toEmail.value || '').trim());
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: fd });
            let json = null;
            try { json = await res.json(); } catch (e) { }
            return { ok: res.ok && json && json.ok, status: res.status, json };
        }

        uploadBtn.onclick = async () => {
            msg.textContent = 'Uploading…';
            const r = await postForm('uploadPhoto');
            if (r.ok) {
                lastUploadURL = r.json.url || '';
                msg.innerHTML = `✅ Uploaded to Drive. ${lastUploadURL}Open file</a>`;
            } else {
                msg.textContent = `Upload failed (${r.status})${r.json && r.json.error ? ': ' + r.json.error : ''}`;
            }
        };

        emailBtn.onclick = async () => {
            const to = (toEmail.value || '').trim();
            if (!to) { msg.textContent = 'Please enter a recipient email.'; return; }
            msg.textContent = 'Sending email…';
            const r = await postForm('emailPhoto');
            if (r.ok) {
                msg.textContent = `✅ Email sent from ${r.json.from} to ${r.json.to}`;
            } else {
                msg.textContent = `Email failed (${r.status})${r.json && r.json.error ? ': ' + r.json.error : ''}`;
            }
        };
    </script>
</body>

</html>
