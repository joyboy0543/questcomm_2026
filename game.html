
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QCPD — Case Room</title>
  <link rel="preload" href="assets/qcpd_logo_small.png" as="image">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header minimal">
    <div class="brand">
      <img src="assets/qcpd_logo_small.png" alt="QCPD" class="brand-logo" />
      <strong>QuestComm Case Room</strong>
    </div>
    <div id="badge" class="badge"></div>
    <div id="progress" class="progress-chips" aria-label="Puzzle progress"></div>
    <div class="mobile-toggles">
      <button id="toggle-left" aria-controls="sidebar-left" aria-expanded="false">Cases</button>
      <button id="toggle-right" aria-controls="sidebar-right" aria-expanded="false">Radio</button>
    </div>
  </header>

  <main class="layout-3col">
    <aside id="sidebar-left" class="sidebar left" aria-label="Case list">
      <h2 class="sidebar-title">Cases</h2>
      <ul id="case-list" class="case-list" aria-live="polite"></ul>
    </aside>

    <section id="puzzle-area" class="content">
      <h2 class="content-title">Open Case</h2>
      <div id="current-case-title" class="current-case-title" aria-live="polite"></div>

      <!-- Themed Tabs -->
      <nav class="tabs" role="tablist" aria-label="Case puzzles">
        <button class="tab active" role="tab" aria-selected="true" aria-controls="tab-1" id="btn-tab-1">Briefing</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="tab-2" id="btn-tab-2">Site Recon</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="tab-3" id="btn-tab-3" disabled>Clue Assembly</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="tab-4" id="btn-tab-4" disabled>World Ledger</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="tab-5" id="btn-tab-5" disabled>Countermeasure Drill</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="tab-6" id="btn-tab-6" disabled>Clearance Granted</button>
      </nav>

      <section id="tab-1" class="tabpanel" role="tabpanel" aria-labelledby="btn-tab-1"></section>
      <section id="tab-2" class="tabpanel" role="tabpanel" aria-labelledby="btn-tab-2" hidden></section>
      <section id="tab-3" class="tabpanel" role="tabpanel" aria-labelledby="btn-tab-3" hidden></section>
      <section id="tab-4" class="tabpanel" role="tabpanel" aria-labelledby="btn-tab-4" hidden></section>
      <section id="tab-5" class="tabpanel" role="tabpanel" aria-labelledby="btn-tab-5" hidden></section>
      <section id="tab-6" class="tabpanel" role="tabpanel" aria-labelledby="btn-tab-6" hidden></section>

      <div id="ariaStatus" class="sr-only" role="status" aria-live="polite"></div>
    </section>

    <aside id="sidebar-right" class="sidebar right" aria-label="Radio messages">
      <h2 class="sidebar-title">Radio Room</h2>
      <div id="radio-ticker" class="radio-ticker" role="log" aria-live="polite" aria-relevant="additions">
        <ul id="radio-feed"></ul>
      </div>
      <div class="radio-controls">
        <button id="pause-scroll" aria-pressed="false">Pause</button>
        <button id="push-message">Push test message</button>
      </div>
    </aside>
  </main>

  <footer class="site-footer confidential">
    <small>CONFIDENTIAL — INTERNAL USE ONLY</small>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/game.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/puzzles_logic.js"></script>
</body>
</html>
