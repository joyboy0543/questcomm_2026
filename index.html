
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuestComm — QCPD Case File</title>
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <style>
    :root {
      --bg:#0f1220; --panel:#1b1f34; --text:#f5f7ff; --accent:#5cc8ff; --muted:#99a1b8; --ok:#3fd27a; --err:#ff6b6b;
      --tap: 48px; /* min tap height */
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 720px; margin: 4vh auto; padding: 16px; background: var(--panel); border-radius: 12px; }
    @media (min-width: 768px){ .wrap{ padding:24px; } }
    label { display:block; margin: 10px 0 6px; color: var(--muted); }
    input[type="text"] { width: 100%; padding: 12px 14px; min-height: var(--tap); border-radius: 10px; border: 1px solid #2a2f48; background: #121527; color: var(--text); font-size: 1rem; }
    input:focus, button:focus { outline: 3px solid #5cc8ff55; outline-offset: 2px; }
    button { background: var(--accent); color:#001622; border:0; padding: 12px 18px; min-height: var(--tap); border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 1rem; }
    button[disabled] { opacity:.5; cursor:not-allowed; }
    .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
    .card { padding:16px; border-radius:12px; background:#141832; margin:14px 0; }
    .media { margin: 10px 0 6px; }
    .media img { max-width: 100%; height: auto; border-radius: 12px; border: 1px solid #2a2f48; }
    .dialogue { font-size:1.05rem; margin: 12px 0; line-height:1.6; }
    .status { margin-top:10px; font-weight:600; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .hidden { display:none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <div id="landing" class="card" role="region" aria-label="QCPD Login">
    <label for="name">Name</label>
    <input id="name" type="text" autocomplete="name" />
    <label for="team">Team</label>
    <input id="team" type="text" />
    <div class="row"><button id="startBtn" aria-label="Start investigation">Start</button></div>
  </div>

  <div id="quiz" class="card hidden" role="region" aria-label="QCPD Case">
    <div id="media" class="media hidden" aria-hidden="true"></div>
    <div id="dialogue" class="dialogue" aria-live="polite"></div>
    <label for="answer">Answer</label>
    <input id="answer" type="text" />
    <div class="row">
      <button id="checkBtn">Check</button>
      <button id="resetPuzzleBtn">Reset Puzzle</button>
      <button id="backBtn">Back</button>
      <button id="nextBtn" disabled>Next</button>
      <button id="resetAllBtn">Reset All</button>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
  </div>
</div>
<script>
const QUIZZES = [
  { dialogue: 'Detective: "Team, take a look at the crime scene snapshot. One item doesn’t belong here at all. Report that item."', a: 'GLOVE', media: [{type:'image', src:'assets/img/crime_scene.png', alt:'Crime scene'}] },
  { dialogue: 'Dispatch: "Lights are out. Sweep the room with your flashlight. If you spot the hidden object, log it now."', a: 'KEY', media: [{type:'image', src:'assets/gif/flashlight_sweep.gif', alt:'Flashlight sweep'}] },
  { dialogue: 'Lead Investigator: "Pin the link that connects our suspect to the location on the evidence board. What is that link?"', a: 'TICKET', media: [{type:'image', src:'assets/img/evidence_board.png', alt:'Evidence board'}] }
];
let current = 0; const completed = Array(QUIZZES.length).fill(false); let profile={name:'',team:''};
const E={landing:document.getElementById('landing'),quiz:document.getElementById('quiz'),name:document.getElementById('name'),team:document.getElementById('team'),startBtn:document.getElementById('startBtn'),media:document.getElementById('media'),dialogue:document.getElementById('dialogue'),answer:document.getElementById('answer'),checkBtn:document.getElementById('checkBtn'),resetPuzzleBtn:document.getElementById('resetPuzzleBtn'),backBtn:document.getElementById('backBtn'),nextBtn:document.getElementById('nextBtn'),resetAllBtn:document.getElementById('resetAllBtn'),status:document.getElementById('status')};
function show(id){document.getElementById(id).classList.remove('hidden')} function hide(id){document.getElementById(id).classList.add('hidden')}
function start(){profile.name=(E.name.value||'').trim(); profile.team=(E.team.value||'').trim(); current=0; completed.fill(false); hide('landing'); show('quiz'); render();}
function render(){const item=QUIZZES[current]; if(item.media&&item.media.length){const m=item.media[0]; E.media.innerHTML=`<img src="${m.src}" alt="${m.alt||''}">`; show('media');} else {E.media.innerHTML=''; hide('media');} E.dialogue.textContent=item.dialogue; E.answer.value=''; E.status.textContent=''; E.status.className='status'; E.backBtn.disabled=(current===0); E.nextBtn.disabled=!completed[current];}
function check(){const given=(E.answer.value||'').trim().toUpperCase(); const expected=QUIZZES[current].a.toUpperCase(); if(!given){E.status.textContent='Please enter an answer.'; E.status.className='status err'; return;} if(given===expected){completed[current]=true; E.status.textContent='Correct.'; E.status.className='status ok'; E.nextBtn.disabled=false;} else {E.status.textContent='Incorrect.'; E.status.className='status err';}}
function resetPuzzle(){completed[current]=false; E.answer.value=''; E.status.textContent=''; E.status.className='status'; E.nextBtn.disabled=true;}
function back(){if(current>0){current--; render();}} function next(){if(completed[current]){if(current<QUIZZES.length-1){current++; render();} else {E.nextBtn.disabled=true; E.status.textContent='All quizzes completed.'; E.status.className='status ok';}}}
function resetAll(){profile={name:'',team:''}; current=0; completed.fill(false); E.name.value=''; E.team.value=''; hide('quiz'); show('landing');}
E.startBtn.addEventListener('click',start); E.checkBtn.addEventListener('click',check); E.resetPuzzleBtn.addEventListener('click',resetPuzzle); E.backBtn.addEventListener('click',back); E.nextBtn.addEventListener('click',next); E.resetAllBtn.addEventListener('click',resetAll);
</script>
</body>
</html>
