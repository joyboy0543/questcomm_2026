
<!-- Page 1 — Agent Details (no puzzle) -->
<div id="p1" class="puzzle-card">
  <h3>Page 1 — Agent Details</h3>
  <p>Optionally take a photo or upload one; add a motivational note. You can also skip photos entirely.</p>

  <div class="flex-row">
    <div style="min-width:240px">
      <img id="p1preview" src="assets/photo_placeholder.png" alt="Agent photo" style="max-width:220px; border:1px solid #223041; border-radius:8px" />
      <div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap">
        <button id="p1camera" class="btn-sm" type="button">Use Camera</button>
        <input id="p1file" type="file" accept="image/*" style="display:none" />
        <button id="p1upload" class="btn-sm" type="button">Upload Photo</button>
        <button id="p1clear" class="btn-sm" type="button">Clear Photo</button>
      </div>
    </div>

    <div style="flex:1">
      <label for="p1note"><strong>Motivational Note (free text)</strong></label>
      <textarea id="p1note" rows="6" style="width:100%; background:#0d1318; color:#e6edf3; border:1px solid #223041; border-radius:8px" placeholder="e.g., 'Stay curious. Every clue counts.'"></textarea>

      <div style="margin-top:8px">
        <span>Select Seal (optional):</span>
        <label class="chip"><input type="radio" name="seal" value="alpha"> Alpha</label>
        <label class="chip"><input type="radio" name="seal" value="bravo"> Bravo</label>
        <label class="chip"><input type="radio" name="seal" value="charlie"> Charlie</label>
      </div>

      <div style="margin-top:8px">
        <button id="p1submit" class="btn-sm" type="button">Agent Details updated</button>
        <span id="p1status" class="status"></span>
      </div>
    </div>
  </div>
</div>
