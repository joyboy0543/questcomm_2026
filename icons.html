<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Icon Preview</title>
  <style>
    :root {
      --bg: #0b1218;
      --panel: #0d1a24;
      --edge: #243546;
      --ink: #cfe6f7;
      --ok: #48e1a8;
      --note: #9ec4df;
      --title-font: "Agency FB", Teko, Antonio, Impact, Haettenschweiler, "Arial Narrow", sans-serif;
      --body-font: system-ui, Segoe UI, Roboto, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body-font);
      margin: 0;
      padding: 24px;
    }

    .card {
      border: 1px solid var(--edge);
      background: var(--panel);
      border-radius: 14px;
      padding: 16px;
      max-width: 720px
    }

    h2 {
      font-family: var(--title-font);
      margin: 0 0 10px;
      color: #6C8ED6
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 10px 0
    }

    .code-label {
      min-width: 160px;
      color: #8bd1ff;
      font-weight: 600
    }

    .code-note {
      color: var(--note)
    }

    .ok {
      color: var(--ok);
      font-weight: 600
    }

    .demo-line {
      margin: 8px 0
    }

    /* Keep icons neatly aligned with text */
    .code-note svg,
    .code-note img,
    .in-text-icon {
      vertical-align: text-bottom;
      margin-left: 6px;
    }
  </style>
</head>

<body>
  <section class="card">
    <h2>📜 Findings — Icon Preview</h2>

    <!-- River Code line with River icon -->
    <div class="row demo-line">
      <span class="code-label">River Code</span>
      <span class="code-note">
        <b>243</b>
        <!-- RIVER / CITY ICON (24x24) -->
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"
          style="vertical-align:text-bottom;margin-left:6px">
          <!-- Buildings -->
          <rect x="2.5" y="6.5" width="5.5" height="7.5" rx="0.8" fill="#E27A3F" stroke="#111" stroke-width="1.5" />
          <rect x="9.5" y="4.5" width="6.0" height="9.5" rx="0.8" fill="#D8C3A5" stroke="#111" stroke-width="1.5" />
          <rect x="17.5" y="6.0" width="4.5" height="8.0" rx="0.8" fill="#E6D5BE" stroke="#111" stroke-width="1.5" />
          <!-- Roof detail -->
          <path d="M18 6 L19.6 4.9 L21 6" fill="#F4EAD5" stroke="#111" stroke-width="1.2" />
          <!-- Windows -->
          <g fill="#FFD54A" stroke="#111" stroke-width="0.9">
            <!-- left bldg -->
            <rect x="3.6" y="7.6" width="1.6" height="1.6" rx="0.2" />
            <rect x="5.8" y="7.6" width="1.6" height="1.6" rx="0.2" />
            <rect x="3.6" y="10.1" width="1.6" height="1.6" rx="0.2" />
            <rect x="5.8" y="10.1" width="1.6" height="1.6" rx="0.2" />
            <rect x="3.6" y="12.6" width="1.6" height="1.6" rx="0.2" />
            <rect x="5.8" y="12.6" width="1.6" height="1.6" rx="0.2" />
            <!-- middle bldg -->
            <rect x="10.5" y="5.8" width="1.7" height="1.7" rx="0.2" />
            <rect x="12.8" y="5.8" width="1.7" height="1.7" rx="0.2" />
            <rect x="10.5" y="8.4" width="1.7" height="1.7" rx="0.2" />
            <rect x="12.8" y="8.4" width="1.7" height="1.7" rx="0.2" />
            <rect x="10.5" y="11.0" width="1.7" height="1.7" rx="0.2" />
            <rect x="12.8" y="11.0" width="1.7" height="1.7" rx="0.2" />
            <!-- right bldg -->
            <rect x="18.3" y="7.3" width="1.5" height="1.5" rx="0.2" />
            <rect x="18.3" y="9.6" width="1.5" height="1.5" rx="0.2" />
            <rect x="18.3" y="11.9" width="1.5" height="1.5" rx="0.2" />
          </g>
          <!-- Water band -->
          <rect x="2" y="14.5" width="20" height="3.0" fill="#3B7EA8" stroke="#111" stroke-width="1.2" rx="0.8" />
          <!-- Waves -->
          <path
            d="M2 15.5c1 0 1.6-.6 2.5-.6s1.6.6 2.5.6 1.6-.6 2.5-.6 1.6.6 2.5.6 1.6-.6 2.5-.6 1.6.6 2.5.6 1.6-.6 2.5-.6V18H2z"
            fill="#6EC6FF" stroke="#111" stroke-width="1.2" />
        </svg>
      </span>
    </div>

    <!-- Success for 287 with crinkled paper -->
    <div class="row demo-line">
      <span class="code-label">Box 1</span>
      <span class="code-note ok">
        Great detective! looks correct.
        <!-- CRINKLED PAPER ICON (20x20) -->
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
          style="vertical-align:text-bottom;margin-left:6px">
          <path fill="#FFFFFF" stroke="#111" stroke-width="1.6"
            d="M7 3h7l5 5v11a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 2-3z" />
          <path fill="#F7F7F7" stroke="#111" stroke-width="1.6" stroke-linecap="round"
            d="M8.8 8.2l2.4-.9l1.6 1.1l2.2-.8m-8.7 5.5l2.4-.9l1.6 1.1l2.2-.8m-8.7 5.5l2.4-.9l1.6 1.1l2.2-.8" />
          <!-- Dog-ear fold -->
          <path d="M14 3.5V8h4.5" fill="#EFEFEF" stroke="#111" stroke-width="1.2" />
        </svg>
      </span>j
    </div>

    <!-- Success for 928 with potion -->
    <div class="row demo-line">
      <span class="code-label">Box 2</span>
      <span class="code-note ok">
        Great detective! looks correct.
        <!-- POTION ICON (20x20) -->
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
          style="vertical-align:text-bottom;margin-left:6px">
          <!-- Bottle body -->
          <path
            d="M7.5 9.5c-2.6 1.8-3.2 5.3-1.4 7.9c1.8 2.6 5.3 3.2 7.9 1.4c2.6-1.8 3.2-5.3 1.4-7.9c-.3-.4-.6-.8-1-1.1l-1.3-1.6V5.5h1.2V3.5H9.7v2H11v2.7l-1.5 1.2c-.1.1-.3.2-.4.3z"
            fill="#59C1AE" stroke="#111" stroke-width="1.5" />
          <!-- Liquid shine band -->
          <path d="M8 12.2c2.1-.9 4.7-.7 6.4.5" fill="none" stroke="#9BE3D7" stroke-width="1.4"
            stroke-linecap="round" />
          <!-- Cork -->
          <rect x="10.2" y="3.5" width="3.6" height="1.8" rx="0.5" fill="#DA9C43" stroke="#111" stroke-width="1.2" />
          <!-- Neck ring -->
          <ellipse cx="12" cy="6" rx="3.2" ry="1.2" fill="#7ED9C8" stroke="#111" stroke-width="1.2" />
          <!-- Sparkles -->
          <g fill="#FFE88A" stroke="#111" stroke-width="1">
            <path d="M18 10 l1 1.6 l1.8.4 l-1.3 1.3 l.3 1.8L18 14l-1.8 1.1l.3-1.8l-1.3-1.3l1.8-.4z" />
            <path d="M7 7 l.7 1.2 l1.3.3 l-.9.9 l.2 1.3L7 10l-1.3.8l.2-1.3l-.9-.9l1.3-.3z" />
          </g>
        </svg>
      </span>
    </div>

  </section>
</body>

</html>
