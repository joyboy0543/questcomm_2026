<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>QuestComm 2026 — Step-by-Step Puzzles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #0f1220;
      --panel: #1b1f34;
      --accent: #5cc8ff;
      --text: #f5f7ff;
      --muted: #a9b0c7;
      --success: #48d17a;
      --error: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 760px;
      margin: 40px auto;
      padding: 24px;
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    h1 {
      margin: 0 0 8px;
      font-weight: 700;
    }

    .sub {
      color: var(--muted);
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      color: var(--muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #2a2f48;
      background: #121527;
      color: var(--text);
    }

    button {
      background: var(--accent);
      color: #001622;
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    button[disabled] {
      opacity: .5;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card {
      padding: 16px;
      border-radius: 10px;
      background: #141832;
      margin: 14px 0;
    }

    .prompt {
      font-size: 1.05rem;
      margin-bottom: 12px;
    }

    .status {
      margin-top: 10px;
      font-weight: 600;
    }

    .status.ok {
      color: var(--success);
    }

    .status.err {
      color: var(--error);
    }

    .footer {
      margin-top: 20px;
      color: var(--muted);
      font-size: .9rem;
    }

    .progress {
      margin: 12px 0;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>QuestComm 2026</h1>
    <div class="sub">Clean step-by-step puzzle flow. No images, no GIFs, no audio.</div>

    <!-- Landing -->
    <div id="landing" class="card">
      <div class="prompt">Enter your details to start or resume:</div>

      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name" />

      <label for="team">Team</label>
      <input id="team" type="text" placeholder="Team name (optional)" />

      <div class="row">
        <button id="startBtn">Start</button>
        <button id="resetBtn">Reset Progress</button>
      </div>

      <div class="progress" id="resumeInfo"></div>
    </div>

    <!-- Game -->
    <div id="game" class="card hidden">
      <div id="stepHeader" class="sub"></div>
      <div id="questionPrompt" class="prompt"></div>

      <div id="optionsBox" class="row hidden"></div>

      <label id="answerLabel" for="answerInput" class="hidden">Your answer</label>
      <input id="answerInput" type="text" class="hidden" />

      <div class="row">
        <button id="checkBtn">Check</button>
        <button id="nextBtn" disabled>Next</button>
        <button id="backBtn">Back</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="footer">
      Build: <span id="buildInfo"></span><br>
      Normal Ctrl+R now loads updates (version gate ensures fresh load).
    </div>
  </div>

  <script>
    /* ---------- CONFIG ---------- */
    const GAME_VERSION = "2026-01-12-stepper-v1";  // bump on updates
    const KEYS = {
      version: "qc_version",
      profile: "qc_profile",
      progress: "qc_progress"
    };

    const PUZZLES = [
      {
        title: "Puzzle 1 — Warm-up",
        type: "mcq",
        prompt: "Which number completes the pattern: 2, 4, 8, 16, ?",
        options: ["18", "24", "32", "34"],
        answer: "32",
        explain: "Powers of two."
      },
      {
        title: "Puzzle 2 — Word",
        type: "text",
        prompt: "Unscramble: RAET",
        answer: "TEAR",
        accept: ["tear", "rate"],
        explain: "Accepts TEAR or RATE."
      },
      {
        title: "Puzzle 3 — Logic",
        type: "mcq",
        prompt: "Which fields can a QR prefill set?",
        options: ["Name only", "Team only", "Both name & team", "Neither"],
        answer: "Both name & team",
        explain: "Use ?name=&team="
      }
    ];

    /* ---------- ELEMENTS ---------- */
    const E = {
      landing: document.getElementById("landing"),
      game: document.getElementById("game"),
      name: document.getElementById("name"),
      team: document.getElementById("team"),
      startBtn: document.getElementById("startBtn"),
      resetBtn: document.getElementById("resetBtn"),
      resumeInfo: document.getElementById("resumeInfo"),
      buildInfo: document.getElementById("buildInfo"),

      stepHeader: document.getElementById("stepHeader"),
      questionPrompt: document.getElementById("questionPrompt"),
      optionsBox: document.getElementById("optionsBox"),
      answerLabel: document.getElementById("answerLabel"),
      answerInput: document.getElementById("answerInput"),

      checkBtn: document.getElementById("checkBtn"),
      nextBtn: document.getElementById("nextBtn"),
      backBtn: document.getElementById("backBtn"),

      status: document.getElementById("status")
    };

    let profile = { name: "", team: "" };
    let progress = 0;

    /* ---------- UTIL ---------- */
    function show(id) { document.getElementById(id).classList.remove("hidden"); }
    function hide(id) { document.getElementById(id).classList.add("hidden"); }
    function save(k, v) { localStorage.setItem(k, v); }
    function load(k) { return localStorage.getItem(k); }
    function normalize(s) { return (s || "").trim().toLowerCase(); }
    function resetState() {
      localStorage.removeItem(KEYS.profile);
      localStorage.removeItem(KEYS.progress);
    }

    /* ---------- VERSION GATE ---------- */
    (function () {
      const v = load(KEYS.version);
      if (v !== GAME_VERSION) {
        resetState();
        save(KEYS.version, GAME_VERSION);
      }
    })();

    /* ---------- PREFILL FROM URL ---------- */
    (function () {
      const p = new URLSearchParams(location.search);
      if (p.get("name")) E.name.value = p.get("name");
      if (p.get("team")) E.team.value = p.get("team");
    })();

    /* ---------- INIT ---------- */
    (function () {
      E.buildInfo.textContent = GAME_VERSION;

      const savedProfile = load(KEYS.profile);
      if (savedProfile) {
        try { profile = JSON.parse(savedProfile); } catch { }
        E.name.value = profile.name || "";
        E.team.value = profile.team || "";
      }

      const savedProgress = load(KEYS.progress);
      if (!isNaN(parseInt(savedProgress))) progress = parseInt(savedProgress);

      if (profile.name) {
        E.resumeInfo.textContent = `Resume as ${profile.name} (Puzzle ${progress + 1}/${PUZZLES.length})`;
      } else {
        E.resumeInfo.textContent = "No saved game.";
      }
    })();

    /* ---------- START ---------- */
    function start() {
      profile.name = E.name.value.trim();
      profile.team = E.team.value.trim();
      save(KEYS.profile, JSON.stringify(profile));

      hide("landing");
      show("game");
      render();
    }

    function render() {
      const step = PUZZLES[progress];
      E.stepHeader.textContent = `${step.title} (${progress + 1}/${PUZZLES.length})`;
      E.questionPrompt.textContent = step.prompt;
      E.status.textContent = "";
      E.nextBtn.disabled = true;

      // Reset UI
      E.optionsBox.innerHTML = "";
      hide("answerLabel");
      hide("answerInput");
      hide("optionsBox");

      if (step.type === "mcq") {
        show("optionsBox");
        step.options.forEach(opt => {
          const b = document.createElement("button");
          b.textContent = opt;
          b.onclick = () => check(opt);
          E.optionsBox.appendChild(b);
        });
      } else {
        show("answerLabel");
        show("answerInput");
        E.answerInput.value = "";
      }
    }

    function check(value) {
      const step = PUZZLES[progress];
      let ok = false;

      if (step.type === "mcq") {
        ok = (value === step.answer);
      } else {
        const input = normalize(E.answerInput.value);
        ok = input && (input === normalize(step.answer) || (step.accept || []).includes(input));
      }

      if (ok) {
        E.status.textContent = "Correct! " + (step.explain || "");
        E.status.className = "status ok";
        E.nextBtn.disabled = false;
        save(KEYS.progress, progress);
      } else {
        E.status.textContent = "Incorrect, try again.";
        E.status.className = "status err";
      }
    }

    E.checkBtn.onclick = () => {
      const step = PUZZLES[progress];
      if (step.type === "text") check(E.answerInput.value);
    };

    E.nextBtn.onclick = () => {
      if (progress < PUZZLES.length - 1) {
        progress++;
        save(KEYS.progress, progress);
        render();
      } else {
        E.status.textContent = "🎉 You finished all puzzles!";
        E.status.className = "status ok";
        E.nextBtn.disabled = true;
      }
    };

    E.backBtn.onclick = () => {
      hide("game");
      show("landing");
    };

    E.startBtn.onclick = start;

    E.resetBtn.onclick = () => {
      resetState();
      profile = { name: "", team: "" };
      progress = 0;
      E.name.value = "";
      E.team.value = "";
      E.resumeInfo.textContent = "Progress reset.";
    };
  </script>
</body>

</html>
